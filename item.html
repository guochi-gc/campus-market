<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品详情 · 校园集市</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="back">← 返回列表</a>
    <h1>商品详情</h1>
    <nav class="topnav">
      <a href="publish.html" class="nav-link nav-link--primary">＋ 发布</a>
      <a href="profile.html" class="nav-link">我的</a>
    </nav>
  </header>

  <div id="detail"></div>

  <div class="pay-mask" id="payMask" hidden>
    <div class="pay-box" role="dialog" aria-modal="true" aria-labelledby="payHead">
      <h3 id="payHead">确认订单</h3>
      <div class="pay-row"><span>商品</span><b id="payTitle"></b></div>
      <div class="pay-row"><span>价格</span><b class="pay-price" id="payPrice"></b></div>
      <div class="pay-row"><span>交易地点</span><b id="payPlace"></b></div>
      <div class="pay-row"><span>支付方式</span><b>模拟支付（演示用，不发生真实扣款）</b></div>
      <div class="pay-actions">
        <button class="pay-cancel" onclick="closePay()">取消</button>
        <button class="pay-ok" onclick="doPay()">确认支付</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <div id="relatedWrap" hidden>
    <h2 class="section-title">同类商品</h2>
    <div class="grid" id="related"></div>
  </div>

  <footer>校园集市 · 人机交互课程作业 · 数据保存在本机浏览器</footer>

  <nav class="tabbar">
    <a href="index.html" class="tab">首页</a>
    <a href="publish.html" class="tab">发布</a>
    <a href="profile.html" class="tab">我的</a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>
