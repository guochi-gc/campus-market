<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的 · 校园集市</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a href="index.html" class="back">← 返回列表</a>
    <h1>我的</h1>
    <nav class="topnav">
      <a href="publish.html" class="nav-link nav-link--primary">＋ 发布</a>
      <a href="profile.html" class="nav-link">我的</a>
    </nav>
  </header>

  <section class="profile-banner">
    <div class="avatar">郭</div>
    <div class="banner-info">
      <p class="p-name">郭　驰</p>
      <p class="p-sub">本机演示账号 · 数据存在浏览器里</p>
    </div>
    <div class="banner-stats">
      <div><b id="statFav">0</b><span>收藏</span></div>
      <div><b id="statHist">0</b><span>足迹</span></div>
      <div><b id="statPost">0</b><span>发布</span></div>
    </div>
  </section>

  <div class="profile-layout">
    <aside class="p-menu">
      <button class="p-item active" data-tab="fav">收藏<span class="p-n" id="menuFav">0</span></button>
      <button class="p-item" data-tab="history">足迹<span class="p-n" id="menuHist">0</span></button>
      <button class="p-item" data-tab="posts">发布<span class="p-n" id="menuPost">0</span></button>
    </aside>

    <div class="p-main">
      <div class="panel" id="panel-fav" role="tabpanel"><div id="favList"></div></div>
      <div class="panel" id="panel-history" role="tabpanel" hidden><div id="historyList"></div></div>
      <div class="panel" id="panel-posts" role="tabpanel" hidden><div id="postList"></div></div>
    </div>
  </div>

  <footer>校园集市 · 人机交互课程作业 · 数据保存在本机浏览器</footer>

  <nav class="tabbar">
    <a href="index.html" class="tab">首页</a>
    <a href="publish.html" class="tab">发布</a>
    <a href="profile.html" class="tab active">我的</a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
