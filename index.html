<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园集市</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>校园集市</h1>
    <span class="count" id="count">共 0 件</span>
    <button class="fav-filter" id="favFilter">只看收藏</button>
  </header>

  <div class="filters" id="filters">
    <button class="active" data-cat="全部">全部</button>
    <button data-cat="教材">教材</button>
    <button data-cat="数码">数码</button>
    <button data-cat="生活">生活</button>
    <button data-cat="运动">运动</button>
    <button data-cat="其他">其他</button>
  </div>

  <div class="grid" id="grid"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
