<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>校园集市 · 校园二手交易</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <a class="brand" href="index.html">校园集市</a>
    <span class="count" id="count">共 0 件</span>
    <nav class="topnav">
      <a href="publish.html" class="nav-link nav-link--primary">＋ 发布</a>
      <a href="profile.html" class="nav-link">我的</a>
    </nav>
    <button class="fav-filter" id="favFilter" aria-pressed="false">只看收藏</button>
  </header>

  <section class="hero">
    <h2>把闲置卖给同校的人</h2>
    <p>教材、数码、生活用品 · 当面交易，不用等快递</p>
    <input id="search" class="search" type="search" placeholder="搜索商品，例如：高数、键盘、台灯" aria-label="搜索商品">
  </section>

  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div class="sort" id="sort" role="group" aria-label="排序方式">
      <button data-sort="default" class="active">默认</button>
      <button data-sort="newest">最新</button>
      <button data-sort="price-asc">价格 ↑</button>
      <button data-sort="price-desc">价格 ↓</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <footer>校园集市 · 人机交互课程作业 · 数据保存在本机浏览器</footer>

  <nav class="tabbar">
    <a href="index.html" class="tab active">首页</a>
    <a href="publish.html" class="tab">发布</a>
    <a href="profile.html" class="tab">我的</a>
  </nav>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
